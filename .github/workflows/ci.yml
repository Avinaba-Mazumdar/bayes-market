name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go Engine & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go Module Dependencies
        run: |
          cd backend
          go mod verify

      - name: Check Go Formatting
        run: |
          cd backend
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "Unformatted Go files detected:"
            echo "$diffs"
            exit 1
          fi

      - name: Go Vet
        run: |
          cd backend
          go vet ./...

      - name: Run AMM Financial Engine Tests (with Race Detector)
        run: |
          cd backend
          go test -v -race ./internal/amm/... ./internal/config/... ./internal/middleware/...

      - name: Build Backend Binary
        run: |
          cd backend
          CGO_ENABLED=0 go build -v -o bin/api cmd/api/main.go

  frontend:
    name: Frontend (Angular Zoneless Build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Root & Workspace Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Angular Frontend (Production Bundle)
        run: |
          cd frontend
          pnpm build

  code-quality:
    name: Code Quality & Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify Prettier Code Formatting
        run: pnpm lint:format
